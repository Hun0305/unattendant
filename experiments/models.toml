# 실험에 쓰는 모델 목록 (docs/experiments.md 3절)
#
# - 사람이 고친다. Huninn은 여기 있는 모델만 고를 수 있다.
# - 파일은 레포 밖 ~/models/gguf/에 받는다: python3 -I experiments/runner/fetch_models.py
# - revision은 받은 저장소의 커밋, sha256은 Hugging Face가 밝힌 LFS 해시다. 받은 뒤 다시 계산해 대조한다.
#   같은 이름의 파일이 나중에 바뀌어도 회차 비교가 깨지지 않게 하려는 것이다.
# - arch는 GGUF 머리의 general.architecture다. upstream llama.cpp가 지원하는 구조만 넣는다.
# - 값은 2026-10-14에 Hugging Face API로 확인했다.

