# 템플릿 llm-bench (docs/experiments.md 5.1절, 10절)
# llama-bench로 프롬프트 처리(pp512)와 생성(tg128, tg128@d2048) 속도를 잰다.
# Huninn과 계획(plan)은 아래 범위 안의 값만 고를 수 있다. 실행은 experiments/runner/llm_bench.py.
# 측정 방법을 바꾸면 version을 올린다. 결과마다 이 파일의 version과 해시가 남는다.

id = "llm-bench"
version = 1
memory_max = "2500M"      # 실행 유닛의 MemoryMax. 실행은 MemorySwapMax=0과 같이 건다 (7.1절)
window = "02:00-05:30"    # 시간대 (7.1절)
invocation_timeout_min = 30  # llama-bench 한 번의 최대 시간
max_attempts = 2          # 무효면 한 번 다시 (7.4절)

[params]
quants = ["Q4_K_M", "Q4_0", "Q5_K_M", "Q8_0"]
threads = [1, 2, 3, 4]
tests = ["pp512", "tg128", "tg128@d2048"]

[fixed]
load_mode = "none"        # mmap 끔. 메모리가 모자랄 때 SD카드에서 다시 읽으며 조용히 느려지지 않게 한다 (5.2절)
# 나머지(배치, KV 캐시 형식, flash attention, 워밍업 1회)는 llama-bench 기본값이고, 실제 값은 결과에 남는다

[tests.pp512]
args = ["-p", "512", "-n", "0"]
reps = 5

[tests.tg128]
args = ["-p", "0", "-n", "128"]
reps = 5

[tests."tg128@d2048"]
args = ["-p", "0", "-n", "128", "-d", "2048"]
reps = 3
